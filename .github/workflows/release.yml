# Two ways to release:
#   - push a tag like v0.1.0
#   - Actions -> release -> Run workflow, with the version (the tag is created for you)
# Either way: static linux binaries (x86_64 + aarch64) attached to the GitHub
# release, each bundled with completions, fish functions and the man page.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'version to release, e.g. v0.1.0'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tag matches Cargo.toml
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG doesn't match Cargo.toml version $want"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get install -y -qq musl-tools
      - run: cargo test
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          name=tre-$TAG-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/tre
          mkdir -p $name/completions $name/fish
          cp $bin README.md LICENSE install.fish $name/
          cp -r fish/functions $name/fish/
          $bin --completions fish > $name/completions/tre.fish
          $bin --completions bash > $name/completions/tre.bash
          $bin --completions zsh  > $name/completions/_tre
          $bin --man > $name/tre.1
          tar czf $name.tar.gz $name
          sha256sum $name.tar.gz | tee $name.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tre-*.tar.gz*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "$TAG" --repo ${{ github.repository }} --clobber tre-*.tar.gz*
          else
            gh release create "$TAG" --repo ${{ github.repository }} --target ${{ github.sha }} \
              --title "tre $TAG" --generate-notes tre-*.tar.gz*
          fi
